<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>警校考研全栈助手</title>
<!-- APP_VERSION: 2026.09.18-v3 -->
<meta name="description" content="警校学生考研+联考+健身+读书全栈管理：计划、打卡、冲突检测、进度追踪">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="考研助手">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23312e81'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E8%AD%A6%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<style>
/* ==================== 基础变量 ==================== */
:root{
  --bg:#f5f5f7; --card:#ffffff; --text:#1a1a2e; --muted:#7a7a8c; --faint:#a0a0b2;
  --primary:#0f3460; --accent:#4B3FE3; --accent-soft:#e8e5ff;
  --border:#e9e9f0; --shadow:0 2px 10px rgba(15,52,96,.08);
  --danger:#e5484d; --warning:#f5a623; --success:#2fa84f;
  --tap:rgba(15,52,96,.06);
  --head-from:#0f3460; --head-to:#4B3FE3; --head-shadow:rgba(79,63,227,.25);
}
[data-theme="dark"]{
  --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --muted:#94a3b8; --faint:#64748b;
  --primary:#818cf8; --accent:#6366f1; --accent-soft:#312e81;
  --border:#334155; --shadow:0 2px 10px rgba(0,0,0,.35);
  --tap:rgba(255,255,255,.06);
  --head-from:#1e1b4b; --head-to:#6366f1; --head-shadow:rgba(99,102,241,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;
  overscroll-behavior-y:none;
}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg)}
main{padding:14px 14px 92px}
.view{display:none;animation:slideIn .26s ease}
.view.active{display:block}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}
/* ==================== 头部 ==================== */
.app-header{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,var(--head-from),var(--head-to));
  color:#fff;padding:14px 16px 14px;
  padding-top:calc(14px + env(safe-area-inset-top));
  border-radius:0 0 20px 20px;box-shadow:0 4px 16px var(--head-shadow);
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.header-title{font-size:19px;font-weight:700;letter-spacing:.5px}
.header-sub{font-size:12px;opacity:.85;margin-top:2px}
.date-nav{display:flex;align-items:center;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:rgba(255,255,255,.32)}
.today-pill{background:rgba(255,255,255,.16);color:#fff;border-radius:16px;padding:6px 12px;font-size:12.5px;font-weight:600}
.countdown{display:flex;gap:10px;margin-top:12px}
.cd-box{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;text-align:center;backdrop-filter:blur(4px)}
.cd-num{font-size:20px;font-weight:800;line-height:1.1}
.cd-label{font-size:11px;opacity:.85;margin-top:2px}
/* ==================== 卡片/通用 ==================== */
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card-title .more{margin-left:auto;font-size:12px;color:var(--accent);font-weight:500}
.muted{color:var(--muted);font-size:12.5px}
.chip{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap}
.chip.gray{background:#ececf2;color:#8a8a99}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.progress{height:8px;border-radius:5px;background:var(--border);overflow:hidden;margin-top:6px}
.progress>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#0f3460,#4B3FE3);transition:width .4s ease}
.progress.green>i{background:linear-gradient(90deg,#1a8a1a,#38c172)}
.progress.orange>i{background:linear-gradient(90deg,#e8740c,#f5a623)}
.section-hint{font-size:12px;color:var(--faint);text-align:center;padding:6px 0 2px}
/* ==================== 时间轴 ==================== */
.timeline{position:relative;padding-left:6px}
.tl-item{position:relative;display:flex;gap:11px;padding:0 0 13px}
.tl-item:last-child{padding-bottom:0}
.tl-line{position:relative;width:46px;flex:none;display:flex;flex-direction:column;align-items:flex-end;padding-top:2px}
.tl-dot{position:absolute;left:-14px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--cat,#999);border:2.5px solid var(--card);z-index:2;box-shadow:0 0 0 1px var(--border)}
.tl-item::before{content:"";position:absolute;left:-9px;top:16px;bottom:0;width:2px;background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-time{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
.tl-card{flex:1;border-radius:11px;padding:9px 11px;background:var(--card);box-shadow:var(--shadow);border-left:3.5px solid var(--cat,#999);position:relative;min-width:0}
.tl-item.done .tl-card{opacity:.62}
.tl-item.done .tl-content{text-decoration:line-through;text-decoration-color:var(--faint)}
.tl-item.dimmed .tl-card{opacity:.48}
.tl-item.dimmed .tl-content{text-decoration:line-through;text-decoration-color:var(--faint)}
.tl-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-content{font-size:14px;font-weight:600;word-break:break-all}
.tl-meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tl-badge{font-size:10.5px;color:var(--warning);border:1px dashed var(--warning);border-radius:5px;padding:0 5px}
.tl-check{position:absolute;right:9px;top:9px;width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;transition:all .2s}
.tl-item.done .tl-check{background:var(--success);border-color:var(--success);color:#fff;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.tl-del{position:absolute;right:9px;bottom:7px;font-size:11px;color:var(--faint);padding:3px 6px;border-radius:6px}
.tl-del:active{background:var(--tap)}
.tl-item.iscurrent .tl-card{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.now-line{position:relative;height:0;margin:2px 0 14px -6px}
.now-line::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--danger);border-radius:2px}
.now-line span{position:absolute;left:0;top:-9px;background:var(--danger);color:#fff;font-size:10px;padding:1px 7px;border-radius:8px;font-weight:600}
/* ==================== 周表格 ==================== */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.week-nav .wn-title{font-size:14.5px;font-weight:700;text-align:center;flex:1}
.week-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;box-shadow:var(--shadow)}
.week-grid{display:grid;grid-template-columns:44px repeat(7,62px);min-width:max-content;background:var(--card);border-radius:12px;overflow:hidden}
.wg-head{padding:8px 2px;text-align:center;font-size:11.5px;font-weight:700;color:#fff;background:linear-gradient(180deg,#163d70,#0f3460)}
.wg-head.today{background:linear-gradient(180deg,#5d52f0,#4B3FE3)}
.wg-head small{display:block;font-weight:400;font-size:10px;opacity:.82}
.wg-time{padding:5px 4px 5px 0;text-align:right;font-size:10px;color:var(--muted);border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.wg-cell{border-top:1px solid var(--border);border-left:1px solid var(--border);min-height:34px;padding:2.5px;display:flex;flex-direction:column;gap:2px;align-items:stretch}
.wg-cell.today-col{background:var(--accent-soft)}
.wg-chip{border-radius:5px;padding:2px 3px;font-size:9.5px;line-height:1.25;color:#fff;overflow:hidden;text-align:center}
.wg-chip.temp{background:#fff0e0;color:#e8740c;border:1px dashed #e8740c;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px}
.legend span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* ==================== 打卡 ==================== */
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{--pct:0;width:96px;height:96px;flex:none;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--pct)*1%),var(--border) 0);
  display:flex;align-items:center;justify-content:center;position:relative}
.ring::before{content:"";position:absolute;inset:8px;background:var(--card);border-radius:50%}
.ring b{position:relative;font-size:21px;font-weight:800}
.ring-info .big{font-size:17px;font-weight:700}
.flame{color:var(--warning)}
.check-card{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.check-card:last-child{border-bottom:none}
.check-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.check-main{flex:1;min-width:0}
.check-name{font-size:14px;font-weight:600}
.check-sub{font-size:11.5px;color:var(--muted)}
.seg{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.seg button{padding:5px 11px;border-radius:14px;border:1px solid var(--border);font-size:12px;color:var(--muted);background:var(--card)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mini-input{width:86px !important;text-align:center;padding:7px 8px !important}
.task-toggle{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px;flex:none}
.task-toggle.on{background:var(--success);border-color:var(--success);color:#fff}
/* ==================== 进度 ==================== */
.subj-head{display:flex;align-items:center;gap:8px}
.subj-badge{background:var(--primary);color:#fff;border-radius:7px;font-size:10.5px;padding:2px 7px;font-weight:700}
.stage-select{margin-top:8px;font-size:12.5px;padding:6px 8px}
.subj-meta{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.7}
.chart-box{position:relative;height:210px;margin-top:6px}
.chart-box.donut{height:230px;max-width:300px;margin:6px auto 0}
.pie-legend{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.pie-legend span{font-size:12.5px;display:flex;align-items:center;gap:7px;color:var(--muted)}
.pie-legend i{width:10px;height:10px;border-radius:3px}
.book-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.book-row:last-child{border:none}
.book-cover{width:34px;height:42px;border-radius:5px;flex:none;background:linear-gradient(135deg,#0f3460,#4B3FE3);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.book-edit{font-size:11px;color:var(--accent);padding:4px 8px;border:1px solid var(--accent);border-radius:12px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.stat-cell{background:var(--bg);border-radius:11px;padding:10px;text-align:center}
.stat-cell b{display:block;font-size:19px;font-weight:800;color:var(--accent)}
.stat-cell span{font-size:11px;color:var(--muted)}
/* ==================== 设置 ==================== */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border:none}
.set-row .lbl{font-size:14px;font-weight:600}
.set-row .sub{font-size:11.5px;color:var(--muted)}
.switch{width:46px;height:27px;border-radius:14px;background:var(--border);position:relative;flex:none;transition:background .2s}
.switch.on{background:var(--accent)}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on i{transform:translateX(19px)}
.btn{display:block;width:100%;text-align:center;padding:12px;border-radius:12px;font-size:14.5px;font-weight:600}
.btn-primary{background:linear-gradient(135deg,#0f3460,#4B3FE3);color:#fff}
.btn-outline{border:1px solid var(--accent);color:var(--accent);background:transparent}
.btn-danger{border:1px solid var(--danger);color:var(--danger);background:transparent}
.btn:active{opacity:.8}
.field{margin-bottom:11px}
.day-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.day-tabs button{flex:none;padding:5px 10px;border-radius:13px;font-size:12px;border:1px solid var(--border);color:var(--muted)}
.day-tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.course-row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.course-row input{padding:7px 9px;font-size:13px}
.course-row .t{width:104px;flex:none}
.course-row .x{width:34px;height:34px;flex:none;border-radius:9px;color:var(--danger);font-size:16px;background:var(--tap)}
.add-row{display:flex;gap:7px;margin-top:4px}
.add-row input{padding:8px 9px;font-size:13px}
.add-row button{flex:none;width:42px;border-radius:10px;background:var(--accent);color:#fff;font-size:20px}
/* ==================== FAB / Tabbar ==================== */
#fab{position:fixed;right:calc(50% - 240px + 18px);bottom:calc(74px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;z-index:40;
  background:linear-gradient(135deg,#5d52f0,#4B3FE3);color:#fff;font-size:30px;font-weight:300;
  box-shadow:0 6px 18px rgba(75,63,227,.5);display:flex;align-items:center;justify-content:center;
  transition:transform .15s}
#fab:active{transform:scale(.9) rotate(90deg)}
@media(max-width:480px){#fab{right:18px}}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;
  background:var(--card);border-top:1px solid var(--border);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;color:var(--faint);font-size:10.5px}
.tab-btn .ti{font-size:20px;line-height:1.2}
.tab-btn.on{color:var(--accent);font-weight:700}
/* ==================== 弹窗 ==================== */
.mask{position:fixed;inset:0;background:rgba(10,10,25,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(60px)}to{transform:translateY(0)}}
.sheet-handle{width:38px;height:4px;border-radius:3px;background:var(--border);margin:0 auto 12px}
.sheet h3{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form2 .full{grid-column:1/3}
.conflict-item{border-radius:11px;padding:10px 12px;margin-bottom:9px;background:var(--bg);border-left:4px solid var(--danger)}
.conflict-item.fixed{border-left-color:var(--faint)}
.conflict-item .ci-top{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;flex-wrap:wrap}
.conflict-item .sug{margin-top:7px;font-size:12.5px;color:var(--success);background:rgba(47,168,79,.1);border-radius:8px;padding:7px 10px}
.conflict-item .sug b{color:var(--success)}
.sheet-actions{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.sheet-actions .row2{display:flex;gap:9px}
.sheet-actions .row2 .btn{flex:1}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:rgba(20,22,40,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:90;max-width:86%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#updBanner{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:95;background:linear-gradient(135deg,#312e81,#6366f1);color:#fff;padding:10px 14px;border-radius:14px;font-size:13px;box-shadow:0 6px 20px rgba(99,102,241,.5);display:flex;align-items:center;gap:10px;max-width:92%;animation:upIn .25s ease}
#updBanner button{background:#fff;color:#4f46e5;border:0;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
@keyframes upIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
/* 资料库 */
.lib-favbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.lib-favchip{background:var(--accent-soft);color:var(--accent);font-size:12px;padding:4px 10px;border-radius:20px;white-space:nowrap}
.res-item{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.res-head{display:flex;align-items:center;gap:9px;padding:12px 12px;background:var(--tap)}
.res-ic{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.res-nm{flex:1;font-size:13.5px;font-weight:600}
.res-star{font-size:17px;padding:2px 4px;color:var(--warning);line-height:1}
.res-arrow{color:var(--muted);font-size:12px;width:12px;text-align:center}
.res-lines{list-style:none;padding:10px 14px 12px;margin:0}
.res-lines li{position:relative;padding:5px 0 5px 16px;font-size:13px;color:var(--muted);line-height:1.6}
.res-lines li::before{content:'•';position:absolute;left:2px;color:var(--accent);font-weight:700}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:30px 10px}
.empty .eicon{font-size:38px;display:block;margin-bottom:8px;opacity:.55}
.pri-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.pri-高{background:#e5484d}.pri-中{background:#f5a623}.pri-低{background:#9aa0b4}
</style>
</head>
<body>
<div id="app">
  <header class="app-header" id="appHeader"></header>
  <main id="main">
    <section class="view" id="view-today"></section>
    <section class="view" id="view-week"></section>
    <section class="view" id="view-checkin"></section>
    <section class="view" id="view-progress"></section>
    <section class="view" id="view-settings"></section>
  </main>
  <button id="fab" aria-label="添加临时安排">+</button>
  <nav class="tabbar" id="tabbar">
    <button class="tab-btn on" data-tab="today"><span class="ti">📅</span>今日</button>

/* ==================== 工具 ==================== */
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return (n<10?'0':'')+n;}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseDK(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mon0(d){return (d.getDay()+6)%7;} // 周一=0
function tmin(t){var p=t.split(':');return (+p[0])*60+(+p[1]);}
function overlap(a,b){return tmin(a.start)<tmin(b.end)&&tmin(b.start)<tmin(a.end);}
function durMin(a){return tmin(a.end)-tmin(a.start);}
function sameDay(a,b){return dkey(a)===dkey(b);}
function daysBetween(a,b){return Math.round((parseDK(b)-parseDK(a))/86400000);}
function fmtDur(mins){if(mins<60)return mins+'分钟';var h=mins/60;return (h%1===0?h:h.toFixed(1))+'小时';}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},2200);}
function confirmDlg(title,msg){return new Promise(function(res){
  $('#cfTitle').textContent=title;$('#cfMsg').textContent=msg;
  $('#confirmMask').classList.add('show');
  $('#cfOk').onclick=function(){$('#confirmMask').classList.remove('show');res(true);};
});}

    if(raw){
      var d=JSON.parse(raw);
      if(d){
        if(!d.version)d.version=1;
        // v1→v2：考研年份纠正（大二2026 → 2028年12月初试）；补晚间洗漱作息无需迁移（常量即时生效）
        if(d.version<2){
          if(d.settings&&d.settings.examDate==='2027-12-26')d.settings.examDate='2028-12-23';
          d.version=2;save();
        }
        if(d.version<3){
          // v3：深色优先、科目目标分、资料库收藏、书单按全栈计划书升级
          if(d.settings&&d.settings.theme==='light')d.settings.theme='dark';
          if(!Array.isArray(d.favResources))d.favResources=[];
          var tg={'101':70,'201':65,'302':125,'822':110};
          (d.subjects||[]).forEach(function(s){if(s.target==null)s.target=tg[s.code];});
          if(Array.isArray(d.books)){
            d.books=d.books.filter(function(b){return b.title!=='当下的力量';});
            defaultData().books.forEach(function(def){
              if(!d.books.some(function(b){return b.title===def.title;}))d.books.push(def);
            });
          }
          d.version=3;save();
        }
        D=d;return;
      }
    }
  }catch(e){}
  D=defaultData();save();
}

/* 临时安排是否在某日生效 */
function tempOnDate(t,date){
  var d=dkey(date);
  if(t.repeat==='daily') return t.date<=d;
  if(t.repeat==='weekly'){var sd=parseDK(t.date);return t.date<=d&&sd.getDay()===date.getDay();}
  return t.date===d;
}

/* 组装某日完整计划（含作息/课表/学习计划/临时/移动覆盖） */
function buildDay(date){
  var wd=mon0(date), dk=dkey(date), items=[];
  FIXED_ROUTINE.forEach(function(r,i){
    items.push({key:'r'+i,start:r.start,end:r.end,content:r.content,category:r.category,source:'routine'});
  });
  (D.courses[DAY_KEYS[wd]]||[]).forEach(function(c,i){
    items.push({key:'c'+i,start:c.start,end:c.end,content:c.name,category:'course',source:'course'});
  });
  (D.studyPlan[DAY_KEYS[wd]]||[]).forEach(function(s,i){
    items.push({key:'s'+i,start:s.start,end:s.end,content:s.subject?s.content+'（'+s.subject+'）':s.content,
      category:s.category||'other',source:'study',subject:s.subject});
  });
  D.tempTasks.forEach(function(t){
    if(tempOnDate(t,date))
      items.push({key:'t'+t.id,start:t.start,end:t.end,content:t.content,category:t.category||'other',
        source:'temp',tempId:t.id,priority:t.priority,repeat:t.repeat});
  });
  // 移动 / 覆盖
  var out=[];
  items.forEach(function(it){
    var ok=dk+'|'+it.key;
    if(it.source!=='routine'){
      if(D.overrides[ok]==='cancelled')it._cancelled=true;
      if(D.overrides[ok]==='moved_out')it._movedOut=true;
    }
    if(D.moves[ok]){it.start=D.moves[ok].start;it.end=D.moves[ok].end;it._moved=true;}
    out.push(it);
  });
  // 移动产生的条目带标记即可；排序
  out.sort(function(a,b){return tmin(a.start)-tmin(b.start)||tmin(a.end)-tmin(b.end);});
  return out;
}

/* 冲突检测：返回冲突数组 + 建议 */
function detectConflicts(date,task){
  var items=buildDay(date).filter(function(it){return !it._cancelled&&!it._movedOut;});
  var conflicts=items.filter(function(it){return overlap(task,it);});
  // 计算空闲段（传入忙碌区间列表，限定 06:00-22:00）
  function computeGaps(busyList){
    var busy=[{start:'06:00',end:'06:00'},{start:'22:00',end:'22:00'}].concat(busyList);
    busy.sort(function(a,b){return tmin(a.start)-tmin(b.start);});
    var merged=[],gaps=[];
    busy.forEach(function(b){
      if(!merged.length||tmin(b.start)>tmin(merged[merged.length-1].end))merged.push({start:b.start,end:b.end});
      else{var m=merged[merged.length-1];if(tmin(b.end)>tmin(m.end))m.end=b.end;}
    });
    for(var i=0;i<merged.length-1;i++){
      if(tmin(merged[i+1].start)-tmin(merged[i].end)>=10)
        gaps.push({start:merged[i].end,end:merged[i+1].start});
    }
    return gaps;
  }
  function freeGaps(ignoreKey){
    var busy=[];
    items.forEach(function(it){if(it.key!==ignoreKey)busy.push({start:it.start,end:it.end});});
    busy.push({start:task.start,end:task.end});
    return computeGaps(busy);
  }
  // 在未来 N 天中找真正空闲的时段（优先 18:30 后的晚间）
  function findFutureSlot(fromDate,need){
    for(var off=1;off<=3;off++){
      var d=addDays(fromDate,off);
      var gaps=computeGaps(buildDay(d).filter(function(it){return !it._cancelled&&!it._movedOut;})
        .map(function(it){return {start:it.start,end:it.end};}));
      var cand=gaps.filter(function(g){return tmin(g.start)>=18*60+30&&durMin(g)>=need;})[0]
        ||gaps.filter(function(g){return durMin(g)>=need;})[0];
      if(cand){
        var em=tmin(cand.start)+need,es=pad(Math.floor(em/60))+':'+pad(em%60);
        return {date:d,start:cand.start,end:es};
      }
    }
    return null;
  }
  conflicts.forEach(function(c){
    c.movable=(c.source==='study'||c.source==='temp');
    c.fixed=(c.source==='routine'||c.source==='course');
    c.suggestion=null;
    if(c.movable){
      var need=durMin(c), gaps=freeGaps(c.key);
      // 优先当天晚于原开始时间的空档
      var cand=gaps.filter(function(g){return tmin(g.start)>=tmin(c.start)&&durMin(g)>=need;})[0]
        ||gaps.filter(function(g){return durMin(g)>=need;})[0];
      if(cand){
        var em=tmin(cand.start)+need,es=pad(Math.floor(em/60))+':'+pad(em%60);
        c.suggestion={start:cand.start,end:es,label:cand.start+' - '+es};
      }else{
        var fut=findFutureSlot(date,need);
        if(fut){
          c.suggestion={date:dkey(fut.date),start:fut.start,end:fut.end,nextDay:true,
            label:(fut.date.getMonth()+1)+'月'+fut.date.getDate()+'日（'+DAY_NAMES[mon0(fut.date)]+'）'+fut.start+' - '+fut.end};
        }else{
          var nd=addDays(date,1),m=tmin('18:45')+need,es2=pad(Math.floor(m/60))+':'+pad(m%60);
          c.suggestion={date:dkey(nd),start:'18:45',end:es2,nextDay:true,
            label:'次日（'+DAY_NAMES[mon0(nd)]+'）18:45 - '+es2+'（该时段可能有安排，请留意）'};
        }
      }
    }
  });
  return conflicts;
}

  }
  // 将任务归入对应时段行（课间10分钟内开始的归入下一节，如10:10→10:20行）
  function bucketIndex(m){
    for(var k=0;k<WEEK_SLOTS.length;k++){
      var s=tmin(WEEK_SLOTS[k]);
      if(m<s)return Math.max(0,k-1);
      if(k<WEEK_SLOTS.length-1){var ns=tmin(WEEK_SLOTS[k+1]);if(m<ns)return (ns-m<=10)?k+1:k;}
    }
    return WEEK_SLOTS.length-1;
  }
  var weekBuckets=[];
  for(var j=0;j<7;j++){
    var cells=WEEK_SLOTS.map(function(){return [];});
    buildDay(addDays(monday,j)).forEach(function(it){
      var bi=bucketIndex(tmin(it.start));
      if(bi>=0&&bi<cells.length)cells[bi].push(it);
    });
    weekBuckets.push(cells);
  }
  WEEK_SLOTS.forEach(function(slot,ri){
    html+='<div class="wg-time">'+slot+'</div>';
    for(var j=0;j<7;j++){
      (function(){
        var d=addDays(monday,j), items=weekBuckets[j][ri];
        html+='<div class="wg-cell'+(sameDay(d,today)?' today-col':'')+'" data-pickday="'+dkey(d)+'">';

          var c=CAT[it.category]||CAT.other;
          var dim=(it._cancelled||it._movedOut)?'opacity:.4;text-decoration:line-through;':'';
          if(it.source==='temp'){
            html+='<div class="wg-chip temp" style="'+dim+'" title="'+esc(it.content)+' '+it.start+'-'+it.end+'">'+esc(it.content.slice(0,6))+'</div>';
          }else if(it.source==='routine'){
            html+='<div class="wg-chip" style="background:'+c.color+';opacity:.75;'+dim+'" title="'+esc(it.content)+'">'+esc(it.content.slice(0,5))+'</div>';
          }else{
            html+='<div class="wg-chip" style="background:'+c.color+';'+dim+'" title="'+esc(it.content)+' '+it.start+'-'+it.end+'">'+esc(it.content.slice(0,6))+'</div>';
          }
        });
        if(items.length>3)html+='<div class="wg-chip" style="background:#bbb">+'+(items.length-3)+'</div>';
        html+='</div>';
      })();
    }
  });
  html+='</div></div>';
  html+='<div class="legend">';
  [['routine','固定作息'],['course','课程'],['kaoyan','考研'],['liankao','联考'],['english','英语'],['fitness','健身'],['reading','读书'],['entertainment','娱乐']].forEach(function(x){
    html+='<span><i style="background:'+CAT[x[0]].color+'"></i>'+x[1]+'</span>';
  });
  html+='<span><i style="background:#fff0e0;border:1px dashed #e8740c"></i>临时安排</span></div></div>';
  $('#view-week').innerHTML=html;
  $('#wPrev').onclick=function(){state.selected=addDays(state.selected,-7);renderAll();};
  $('#wNext').onclick=function(){state.selected=addDays(state.selected,7);renderAll();};
  $all('[data-pickday]').forEach(function(cell){

var FITNESS_TYPES=['上肢','下肢','有氧','休息'];
var GOALS={words:50,mathMin:90,engMin:45,majorMin:60,readPages:15,waterCups:10};
function dayCompletion(date){
  var ci=D.checkins[dkey(date)]||{tasks:{}};
  var metrics=[
    (ci.words||0)>=GOALS.words,
    (ci.mathMin||0)>=GOALS.mathMin,
    (ci.engMin||0)>=GOALS.engMin,
    (ci.majorMin||0)>=GOALS.majorMin,
    !!ci.fitType,
    (ci.readPages||0)>0,
    (ci.waterCups||0)>=GOALS.waterCups
  ];
  var mScore=metrics.filter(Boolean).length/metrics.length;
  var tasks=buildDay(date).filter(function(it){return it.source!=='routine'&&!it._cancelled&&!it._movedOut;});
  var done=tasks.filter(function(it){return ci.tasks&&ci.tasks[it.key];}).length;
  var tScore=tasks.length?done/tasks.length:0;
  var pct=tasks.length?Math.round((mScore*.6+tScore*.4)*100):Math.round(mScore*100);
  return {pct:pct,done:done,total:tasks.length};
}
function calcStreak(){
  var n=0,d=new Date();
  // 今天没打卡不算断，从昨天起往前
  if(dayCompletion(d).pct<50)d=addDays(d,-1);
  while(dayCompletion(d).pct>=50){n++;d=addDays(d,-1);
    if(n>400)break;}
  return n;
}

function weekCategoryMinutes(anchor){
  var mon=addDays(anchor,-mon0(anchor));
  var agg={kaoyan:0,english:0,fitness:0,reading:0,liankao:0};
  for(var i=0;i<7;i++){
    var c=D.checkins[dkey(addDays(mon,i))];
    if(!c)continue;
    agg.kaoyan+=(c.mathMin||0)+(c.majorMin||0);
    agg.english+=(c.engMin||0)+(c.words||0)*0.5;
    if(c.fitType&&c.fitType!=='休息')agg.fitness+=50;
    agg.reading+=(c.readPages||0)*2;
  }
  return agg;
}

/* 轻量离线降级图 */
function fallbackLine(cv,data,labels,target,dark){
  var dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  var W=r.width,H=r.height,P=34;
  ctx.clearRect(0,0,W,H);
  if(data.length<1){ctx.fillStyle=dark?'#888':'#aaa';ctx.font='12px sans-serif';ctx.fillText('暂无体重记录',W/2-40,H/2);return;}
  var vals=data.concat([target]);var mn=Math.min.apply(null,vals)-1,mx=Math.max.apply(null,vals)+1;
  function X(i){return P+(W-P-10)*(data.length===1?.5:i/(data.length-1));}
  function Y(v){return H-24-(H-24-10)*(mx===mn?.5:(v-mn)/(mx-mn));}
  ctx.strokeStyle=dark?'#2c3049':'#eee';ctx.lineWidth=1;
  for(var g=0;g<4;g++){var yy=10+(H-40)*g/3;ctx.beginPath();ctx.moveTo(P,yy);ctx.lineTo(W-5,yy);ctx.stroke();}
  ctx.setLineDash([6,5]);ctx.strokeStyle='#2fa84f';
  ctx.beginPath();ctx.moveTo(P,Y(target));ctx.lineTo(W-5,Y(target));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#2fa84f';ctx.font='10px sans-serif';ctx.fillText(target+'kg',2,Y(target)+3);
  ctx.strokeStyle='#4B3FE3';ctx.lineWidth=2.2;ctx.beginPath();
  data.forEach(function(v,i){i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v));});ctx.stroke();
  data.forEach(function(v,i){ctx.fillStyle='#4B3FE3';ctx.beginPath();ctx.arc(X(i),Y(v),3.5,0,7);ctx.fill();});
  ctx.fillStyle=dark?'#999':'#888';ctx.font='10px sans-serif';
  labels.forEach(function(l,i){if(i%Math.ceil(labels.length/4)===0)ctx.fillText(l,X(i)-12,H-8);});
}
function fallbackDonut(cv,parts){
  var dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  var cx=r.width/2,cy=r.height/2,R=Math.min(cx,cy)-8,sum=parts.reduce(function(s,p){return s+p.v;},0),a0=-Math.PI/2;
  parts.forEach(function(p){var a1=a0+p.v/sum*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();ctx.fillStyle=p.c;ctx.fill();a0=a1;});
  ctx.beginPath();ctx.arc(cx,cy,R*.6,0,7);ctx.fillStyle=getComputedStyle(document.body).backgroundColor;ctx.fill();
}

  var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  html+='<div class="card"><div class="card-title">📱 安装到手机桌面</div>'+
    (standalone?'<div class="muted">✅ 当前已在桌面模式运行</div>':
    (deferredInstall?'<button class="btn btn-primary" id="btnInstall" style="margin-bottom:10px">⬇️ 安装「考研计划」到桌面</button>':'')+
    '<div class="muted"><b>华为手机（华为浏览器）：</b>点底部「四点」菜单 →「添加至桌面」或「安装应用」<br>'+
    '<b>鸿蒙系统也可用 Edge 浏览器：</b>打开本页 → 底部菜单 →「添加到手机屏幕」<br>'+
    '<b>iOS：</b>Safari 分享按钮 →「添加到主屏幕」<br>'+
    '安装后全屏运行、断网可用，数据全部保存在本机。</div>')+'</div>';

  $('#view-settings').innerHTML=html;

  $('#setHeight').onchange=function(){s.heightCm=+this.value;save();};
  $('#setWeight').onchange=function(){s.weightKg=+this.value;save();renderHeader();};
  $('#setTarget').onchange=function(){s.targetWeightKg=+this.value;save();renderProgress();renderHeader();};
  $('#setExam').onchange=function(){s.examDate=this.value;save();renderHeader();};
  $('#swTheme').onclick=function(){s.theme=s.theme==='dark'?'light':'dark';applyTheme();save();renderSettings();if(state.tab==='progress')renderProgress();};
  $('#swNotify').onclick=async function(){
    if(!s.notify){
      if(!('Notification' in window)){toast('当前浏览器不支持通知');return;}
      var p=await Notification.requestPermission();
      if(p!=='granted'){toast('通知权限被拒绝');return;}
      s.notify=true;toast('已开启任务提醒');
    }else s.notify=false;
    save();renderSettings();
  };
  $all('[data-cday]').forEach(function(b){b.onclick=function(){settingsCourseDay=+b.getAttribute('data-cday');renderSettings();};});
  renderCourseList();
  $('#ncAdd').onclick=function(){
    var st=$('#ncStart').value,en=$('#ncEnd').value,nm=$('#ncName').value.trim();
    if(!nm){toast('请输入课程名');return;}
    if(tmin(en)<=tmin(st)){toast('结束时间需晚于开始时间');return;}
    D.courses[DAY_KEYS[settingsCourseDay]].push({start:st,end:en,name:nm});save();renderCourseList();
    $('#ncName').value='';renderAll();toast('已添加课程');
  };
  $('#btnExport').onclick=exportData;
  $('#btnImport').onclick=function(){$('#importFile').click();};
  $('#importFile').onchange=importData;
  $('#btnClear').onclick=async function(){
    if(await confirmDlg('清除全部数据','将删除所有打卡、临时安排、进度记录并恢复默认课表，此操作不可恢复！')){
      localStorage.removeItem(STORE_KEY);load();applyTheme();renderAll();toast('已重置为初始数据');
    }
  };
  var bi=$('#btnInstall');
  if(bi)bi.onclick=function(){
    if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(function(){deferredInstall=null;renderSettings();});}
  };
}
function renderCourseList(){
  var key=DAY_KEYS[settingsCourseDay],list=D.courses[key];
  var html=list.length?list.map(function(c,i){
    return '<div class="course-row"><input class="t" type="time" value="'+c.start+'" data-ci="'+i+'" data-ck="start">'+
      '<input class="t" type="time" value="'+c.end+'" data-ci="'+i+'" data-ck="end">'+
      '<input type="text" value="'+esc(c.name)+'" data-ci="'+i+'" data-ck="name" style="flex:1">'+
      '<button class="x" data-delc="'+i+'">×</button></div>';}).join('')
    :'<div class="empty" style="padding:14px">当天无课</div>';
  $('#courseList').innerHTML=html;
  $all('[data-ci]',$('#courseList')).forEach(function(inp){
    inp.onchange=function(){
      var c=list[+inp.getAttribute('data-ci')];
      c[inp.getAttribute('data-ck')]=inp.type==='text'?inp.value.trim():inp.value;
      save();renderAll();
    };
  });
  $all('[data-delc]').forEach(function(b){b.onclick=function(){
    list.splice(+b.getAttribute('data-delc'),1);save();renderCourseList();renderAll();toast('已删除课程');
  };});
}

function exportData(){
  var blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='警校考研计划备份_'+dkey(new Date()).replace(/-/g,'')+'.json';
  a.click();URL.revokeObjectURL(a.href);toast('备份已导出');
}
function importData(e){
  var f=e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d.version||!d.settings)throw new Error('bad');
      D=d;save();applyTheme();renderAll();toast('导入成功');
    }catch(err){toast('文件格式不正确，导入失败');}
  };
  rd.readAsText(f);e.target.value='';
}

/* ==================== 临时安排流程 ==================== */
var pendingTask=null;
function openTaskSheet(){
  $('#fDate').value=dkey(state.selected);
  $('#fStart').value='19:00';$('#fEnd').value='20:00';
  $('#fContent').value='';$('#fCat').value='kaoyan';$('#fPri').value='中';$('#fRepeat').value='none';
  $('#taskMask').classList.add('show');
}
function readForm(){
  var t={date:$('#fDate').value,start:$('#fStart').value,end:$('#fEnd').value,
    content:$('#fContent').value.trim(),category:$('#fCat').value,priority:$('#fPri').value,
    repeat:$('#fRepeat').value};
  return t;
}
$('#fSubmit').onclick=function(){
  var t=readForm();
  if(!t.content){toast('请填写内容');return;}
  if(!t.date){toast('请选择日期');return;}
  if(tmin(t.end)<=tmin(t.start)){toast('结束时间需晚于开始时间');return;}
  if(tmin(t.start)<6*60||tmin(t.end)>22*60){
    toast('请安排在 06:00 - 22:00 作息时间内');return;
  }
  pendingTask=t;
  var conflicts=detectConflicts(parseDK(t.date),t);
  if(!conflicts.length){commitTask(t);return;}
  // 渲染冲突
  var html='';
  var hasFixed=false,allMovable=true;
  conflicts.forEach(function(c,ci){
    var cat=CAT[c.category]||CAT.other;
    html+='<div class="conflict-item '+(c.fixed?'fixed':'')+'">'+
      '<div class="ci-top">'+catChip(c.category)+esc(c.content)+
      '<span class="muted" style="font-weight:400;font-size:12px">'+c.start+'-'+c.end+' · '+fmtDur(durMin(c))+'</span></div>';
    if(c.fixed){
      hasFixed=true;allMovable=false;
      html+='<div class="sug" style="color:var(--warning);background:rgba(245,166,35,.12)">🔒 '+
        (c.source==='routine'?'固定作息不可调整':'正式课程不建议移动')+'，建议手动调整临时安排时间</div>';
    }else if(c.suggestion){
      html+='<div class="sug">💡 建议移至 <b>'+c.suggestion.label+'</b></div>';
    }
    html+='</div>';
  });
  $('#conflictList').innerHTML=html;
  $('#cAccept').style.display=allMovable?'':'none';
  $('#conflictMask').classList.add('show');
  $('#taskMask').classList.remove('show');

  $('#cAccept').onclick=function(){
    var cs=detectConflicts(parseDK(t.date),t);
    var dk=t.date;
    cs.forEach(function(c){
      if(!c.movable||!c.suggestion)return;
      if(c.suggestion.nextDay){
        // 移动到未来日期：创建一条一次性"顺延"安排，原当条目标记已顺延
        D.tempTasks.push({id:uid(),date:c.suggestion.date,start:c.suggestion.start,end:c.suggestion.end,
          content:c.content+'（顺延）',category:c.category,priority:'中',repeat:'none',createdAt:Date.now()});
        D.overrides[dk+'|'+c.key]='moved_out';
      }else{
        D.moves[dk+'|'+c.key]={start:c.suggestion.start,end:c.suggestion.end};
      }
    });
    commitTask(t,true);
  };
  $('#cManual').onclick=function(){
    $('#conflictMask').classList.remove('show');
    $('#taskMask').classList.add('show');
  };
  $('#cForce').onclick=function(){
    var cs=detectConflicts(parseDK(t.date),t),dk=t.date;
    cs.forEach(function(c){
      if(c.source==='study'||c.source==='temp')D.overrides[dk+'|'+c.key]='cancelled';
    });
    commitTask(t,true);
  };
};
function commitTask(t,afterConflict){
  t.id=uid();t.createdAt=Date.now();
  D.tempTasks.push(t);save();
  $('#taskMask').classList.remove('show');$('#conflictMask').classList.remove('show');
  state.selected=parseDK(t.date);
  renderAll();
  toast(afterConflict?'临时安排已保存（冲突已处理）':'✅ 无冲突，已保存');
  if(D.settings.notify&&'Notification'in window&&Notification.permission==='granted'){
    try{new Notification('临时安排已添加',{body:t.start+'-'+t.end+' '+t.content});}catch(e){}
  }
}

/* ==================== 图书编辑 ==================== */
var editingBookId=null, bkCurrentFlag=false;
function editBook(id){
  var b=id?D.books.find(function(x){return x.id===id;}):null;
  editingBookId=id||null;
  bkCurrentFlag=b?!!b.current:false;
  $('#bkTitle2').textContent=b?'📖 编辑图书':'📖 添加图书';
  $('#bkName').value=b?b.title:'';
  $('#bkTotal').value=b?b.total:200;
  $('#bkRead').value=b?b.read:0;
  $('#bkCurrent').classList.toggle('on',bkCurrentFlag);
  $('#bkDelete').style.display=b?'block':'none';
  $('#bookMask').classList.add('show');
}
$('#bkCurrent').onclick=function(){
  bkCurrentFlag=!bkCurrentFlag;
  $('#bkCurrent').classList.toggle('on',bkCurrentFlag);
};
$('#bkSave').onclick=function(){
  var title=$('#bkName').value.trim(),total=parseInt($('#bkTotal').value,10),read=parseInt($('#bkRead').value,10);
  if(!title){toast('请输入书名');return;}
  if(!(total>0)){toast('总页数需大于0');return;}
  if(isNaN(read)||read<0)read=0;
  if(editingBookId){
    var b=D.books.find(function(x){return x.id===editingBookId;});
    b.title=title;b.total=total;b.read=read;b.current=bkCurrentFlag;
  }else{
    D.books.push({id:uid(),title:title,total:total,read:read,current:bkCurrentFlag});
  }
  save();$('#bookMask').classList.remove('show');renderProgress();toast('已保存');
};
$('#bkDelete').onclick=async function(){
  if(!editingBookId)return;
  if(await confirmDlg('删除图书','将从书单中删除此书（历史打卡记录保留）。')){
    D.books=D.books.filter(function(x){return x.id!==editingBookId;});
    save();$('#bookMask').classList.remove('show');renderProgress();toast('已删除');
  }
};

/* ==================== 主题 / PWA ==================== */
function applyTheme(){
  document.documentElement.dataset.theme=D.settings.theme;
  var meta=document.querySelector('meta[name=theme-color]');
  if(meta)meta.setAttribute('content',D.settings.theme==='dark'?'#6366f1':'#0f3460');
}
var APP_VERSION='2026.09.18-v3';
var deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();deferredInstall=e;
  if(state.tab==='settings')renderSettings();
});

/* 新版本提示条 */
function showUpdateBanner(reg){
  if(document.getElementById('updBanner'))return;
  var b=document.createElement('div');
  b.id='updBanner';
  b.innerHTML='🎉 发现新版本，立即更新以获得最新计划安排 <button id="updBtn">立即更新</button>';
  document.body.appendChild(b);
  $('#updBtn').onclick=function(){
    try{reg.waiting.postMessage('SKIP_WAITING');}catch(e){location.reload();}
  };
}
function setupPWA(){
  // 注册 Service Worker（需 HTTPS 或 localhost；普通局域网 http 下静默跳过，不影响使用）
  if('serviceWorker'in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        function promptIfWaiting(){if(reg.waiting)showUpdateBanner(reg);}
        promptIfWaiting();
        reg.addEventListener('updatefound',function(){
          var nw=reg.installing;
          if(!nw)return;
          nw.addEventListener('statechange',function(){
            if(nw.state==='installed'){
              if(navigator.serviceWorker.controller)showUpdateBanner(reg);
            }
  });
        });
        // 每小时 + 每次重新可见时检查更新，保证"一直最新"
        setInterval(function(){reg.update();},3600000);
        document.addEventListener('visibilitychange',function(){if(!document.hidden)reg.update();});
      }).catch(function(){});
      // 新版本已接管 → 刷新到最新
      var refreshing=false;
      navigator.serviceWorker.addEventListener('controllerchange',function(){
        if(refreshing)return;refreshing=true;location.reload();
      });
    });
  }
}

/* ==================== 提醒循环 ==================== */
var firedKeys={};
function reminderTick(){
  if(!D.settings.notify||!('Notification'in window)||Notification.permission!=='granted')return;
  var now=new Date(),nm=now.getHours()*60+now.getMinutes(),dk=dkey(now);
  buildDay(now).forEach(function(it){
    if(it.source==='routine'||it._cancelled)return;
    var gap=tmin(it.start)-nm,k=dk+'|'+it.key;
    if(gap>=14&&gap<=16&&!firedKeys[k]){
      firedKeys[k]=1;
      try{new Notification('⏰ 15分钟后：'+it.content,{body:it.start+' 开始 · '+CAT[it.category].label});}catch(e){}
    }
  });
  // 周日提醒
  if(now.getDay()===0){
    if(nm>=7*60&&nm<7*60+2&&!firedKeys['weight']){firedKeys.weight=1;
      try{new Notification('⚖️ 周日称重日',{body:'早晨空腹记录体重，追踪减脂进度'});}catch(e){}}
    if(nm>=18*60&&nm<18*60+2&&!firedKeys['review']){firedKeys.review=1;
      try{new Notification('📝 周复盘时间',{body:'花30分钟回顾本周、调整下周计划'});}catch(e){}}
  }
}

/* ==================== Tab 切换 / 渲染 ==================== */
var renderedTabs={};
function switchTab(tab){
  state.tab=tab;
  $all('.view').forEach(function(v){v.classList.toggle('active',v.id==='view-'+tab);});
  $all('.tab-btn').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===tab);});
  $('#fab').style.display=(tab==='today'||tab==='week')?'flex':'none';
  if(tab==='today')renderToday();
  if(tab==='week')renderWeek();
  if(tab==='checkin')renderCheckin();
  if(tab==='progress')renderProgress();
  if(tab==='settings'&&!renderedTabs.settings){renderSettings();renderedTabs.settings=true;}
  renderedTabs[tab]=true;
}
function renderAll(){
  renderHeader();
  renderToday();
  if(renderedTabs.week)renderWeek();
  if(renderedTabs.checkin)renderCheckin();
  if(renderedTabs.progress)renderProgress();
  if(renderedTabs.settings)renderSettings();
}

$all('.tab-btn').forEach(function(b){
  b.onclick=function(){switchTab(b.getAttribute('data-tab'));};
});
$('#fab').onclick=openTaskSheet;

/* ==================== 启动 ==================== */
load();
applyTheme();
setupPWA();
renderHeader();
renderToday();
setInterval(function(){
  if(state.tab==='today')renderToday();
  reminderTick();
},60000);
reminderTick();
// Chart.js（CDN 延迟加载）就绪后，若在进度页则重绘
var chartEl=document.querySelector('script[src*="chart.js"]');
if(chartEl)chartEl.addEventListener('load',function(){if(renderedTabs.progress)renderProgress();});
})();
</script>
